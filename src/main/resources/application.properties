spring.application.name=proyecto_de_aula

# MySQL credentials are supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/empresa?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Photos uploaded by the administrator
app.upload.dir=${APP_UPLOAD_DIR:uploads/fotos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Error handling for the custom 404 handler
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Optional Base64-encoded 256-bit JWT secret. A temporary key is generated if unset.
app.jwt.secret=${JWT_SECRET:}

# SMTP credentials and connection are configured outside source control.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@refugionuevavida.org}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Optional Gemini-powered support assistant. Keep the API key in the environment.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.proxy-url=${GEMINI_PROXY_URL:}

# Used only by the Docker demonstration data initializer.
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:demo12345}
